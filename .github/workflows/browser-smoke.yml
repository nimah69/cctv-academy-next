name: Browser smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: node tests/browser-smoke.mjs
